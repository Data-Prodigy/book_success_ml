name: CI Pipeline

on:
  push:
    branches: [dev_branch]
  pull_request:

jobs:
  # Fast checks on every push and pull request: unit tests + the Docker image builds.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Build the Docker image
        run: docker compose -f docker-compose.yaml build feature_pipeline

  # Full end-to-end run (feature store -> training -> inference -> API).
  # Only on main: it needs the real secrets and writes to your Hopsworks feature group.
  pipeline:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f docker-compose.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Check the dataset is in the repo
        run: |
          if [ ! -s data/openlibrary_books.csv ]; then
            echo "data/openlibrary_books.csv is missing - commit it to the repo"
            exit 1
          fi

      - name: Create .env from secrets
        run: printf 'HOPSWORKS_API_KEY=%s\n' '${{ secrets.HOPSWORKS_API_KEY }}' > .env

      - name: Build Docker images
        run: ${{ env.COMPOSE }} build

      # Each stage runs on its own; --exit-code-from fails the job if that stage fails.
      - name: Feature pipeline
        run: ${{ env.COMPOSE }} up --no-deps --exit-code-from feature_pipeline feature_pipeline

      - name: Start MLflow
        run: ${{ env.COMPOSE }} up -d --no-deps --wait mlflow

      - name: Training pipeline
        run: ${{ env.COMPOSE }} up --no-deps --exit-code-from training_pipeline training_pipeline

      - name: Inference pipeline (scores the real hold-out books)
        run: ${{ env.COMPOSE }} up --no-deps --exit-code-from inference inference

      - name: Start FastAPI
        run: ${{ env.COMPOSE }} up -d --no-deps --wait fastapi

      - name: Smoke-test the API
        run: |
          curl --fail -s http://localhost:8085/health
          curl --fail -s "http://localhost:8085/holdout?limit=3"
          AUTHOR=$(curl --fail -s "http://localhost:8085/holdout?limit=1" | python3 -c "import sys,json; print(json.load(sys.stdin)['rows'][0]['author_key'])")
          YEAR=$(( $(date +%Y) + 1 ))
          curl --fail -s -X POST http://localhost:8085/predict/ -H 'Content-Type: application/json' \
               -d "{\"author_key\": \"$AUTHOR\", \"book_published_year\": $YEAR}"
          # more than 5 years ahead must be refused with 422
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8085/predict/ \
               -H 'Content-Type: application/json' -d "{\"author_key\": \"$AUTHOR\", \"book_published_year\": $(( $(date +%Y) + 6 ))}")
          test "$CODE" = "422"

      - name: Show logs if something failed
        if: failure()
        run: ${{ env.COMPOSE }} logs --tail=200

      - name: Tear down
        if: always()
        run: ${{ env.COMPOSE }} down -v